project_name: "Open Edu Video Generator Pro Style 12GB"

output_resolution:
  width: 1920
  height: 1080

fps: 30
visual_mode: "hybrid"

ffmpeg_path: "C:\\Users\\User\\Documents\\Codex\\Tools\\Transcribe\\ffmpeg\\ffmpeg-9.0.1-essentials_build\\bin\\ffmpeg.exe"
ffprobe_path: "C:\\Users\\User\\Documents\\Codex\\Tools\\Transcribe\\ffmpeg\\ffmpeg-9.0.1-essentials_build\\bin\\ffprobe.exe"

ollama_url: "http://localhost:11434"
ollama_model: "qwen3:14b"
use_ollama: true

vision_qa:
  enabled: true
  model: "qwen2.5vl:7b"
  max_attempts: 3
  minimum_relevance: 0.78
  minimum_subject_match: 0.72
  block_on_failure: true
  timeout_seconds: 600

tts_provider: "edge"
edge_tts:
  voice: "en-IN-NeerjaNeural"
  rate: "-20%"

piper_path: "C:/piper/piper.exe"
piper_model: "C:/piper/voices/en_US-lessac-medium.onnx"
piper_config: "C:/piper/voices/en_US-lessac-medium.onnx.json"

voice:
  sentence_gap_seconds: 0.25
  scene_gap_seconds: 0.7

render:
  layout: modern
  burn_captions: true
  embed_subtitles: false
  background: "#F7F8F3"
  ink: "#182026"
  accent: "#2E7D63"
  second_accent: "#D18B32"
  subtitle_bg: "#000000"
  subtitle_fg: "#FFFFFF"
  seconds_per_segment_without_audio: 5.0
  video_crf: 16
  video_bitrate: "8000k"
  video_maxrate: "10000k"
  video_bufsize: "16000k"
  video_preset: "slow"
  reviewed_assets_dir: "assets/reviewed"
  font_path: ""

comfyui:
  api_url: "http://127.0.0.1:8188"
  enabled: true
  workflow_path: "workflows/flux_schnell_fp8_api.json"
  checkpoint: "flux1-schnell-fp8.safetensors"
  width: 1024
  height: 576
  steps: 4
  cfg: 1.0
  sampler_name: "euler"
  scheduler: "simple"
  seed: -1
  timeout_seconds: 1800
  fallback_to_slideshow: false
  rewrite_prompts: false
  prompt_prefix: "sharp high-resolution educational documentary photograph, exact named scientific subject, physically realistic anatomy, clear focal subject, fine natural detail, neutral natural colors, soft daylight, label-safe negative space,"
  prompt_suffix: "single coherent realistic scene, scientifically plausible structure, text-free image, no labels, no arrows, no caption, no watermark, no logo, no border, no infographic, no cartoon style, no painterly style, no duplicated anatomy, no deformed organisms"
  negative_prompt: "text, letters, typography, labels, captions, watermark, logo, signature, diagram, infographic, chart, collage, grid, panels, border, blurry, distorted anatomy, duplicate parts, oversaturated, bad motion, flicker"
  video_enabled: true
  video_workflow_path: "workflows/ltx_video_12gb_api.json"
  video_width: 768
  video_height: 512
  video_frames: 81
  video_fps: 16
  video_steps: 8
  video_cfg: 1.0
  video_sampler_name: "euler"
  video_scheduler: "simple"
  real_image_auto_promote: true
  video_auto_promote: false
  video_max_segments: 1
  video_prompt_prefix: "realistic educational nature video, stable camera, gentle natural motion, coherent subject,"
  video_prompt_suffix: "short cinematic b-roll, natural motion, coherent anatomy, no text, no subtitles, no watermark"

